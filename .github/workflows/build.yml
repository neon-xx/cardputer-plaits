name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  host-test:
    name: Host tests (synth core on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: make -C host_test && ./host_test/host_test

  firmware:
    name: Firmware (Cardputer ADV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: pio run -e cardputer-adv
      - name: Merge into a single flashable image
        run: |
          B=.pio/build/cardputer-adv
          APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32s3 merge_bin \
            -o $B/plaitsputer-merged.bin --flash_mode dio --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$APP0" 0x10000 $B/firmware.bin
      - name: M5Launcher image (app-only, installs into Launcher's OTA slot)
        run: cp .pio/build/cardputer-adv/firmware.bin .pio/build/cardputer-adv/plaitsputer-m5launcher.bin
      - uses: actions/upload-artifact@v4
        with:
          name: plaitsputer-firmware
          path: |
            .pio/build/cardputer-adv/plaitsputer-merged.bin
            .pio/build/cardputer-adv/plaitsputer-m5launcher.bin
            .pio/build/cardputer-adv/firmware.bin
            .pio/build/cardputer-adv/bootloader.bin
            .pio/build/cardputer-adv/partitions.bin

  release:
    name: Publish release
    # Runs when a version tag (v*) is pushed, or when a release is published by hand.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: [host-test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plaitsputer-firmware
          path: fw
      - name: Create release (if needed) and upload firmware
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          cd fw
          mv plaitsputer-merged.bin     "plaitsputer-${TAG}-merged.bin"
          mv plaitsputer-m5launcher.bin "plaitsputer-${TAG}-m5launcher.bin"
          mv firmware.bin               "plaitsputer-${TAG}-app.bin"
          mv bootloader.bin             "plaitsputer-${TAG}-bootloader.bin"
          mv partitions.bin             "plaitsputer-${TAG}-partitions.bin"
          sha256sum *.bin > SHA256SUMS.txt
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sed "s/__TAG__/${TAG}/g" ../.github/RELEASE_NOTES.md > notes.md
            PRE=""
            case "$TAG" in v0.*|*-*) PRE="--prerelease" ;; esac   # v0.x and v1.0-rc etc.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Plaitsputer ${TAG}" --notes-file notes.md $PRE
          fi
          gh release upload "$TAG" *.bin SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
