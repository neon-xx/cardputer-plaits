; Plaitsputer - polyphonic Plaits for the M5Stack Cardputer ADV
; Build & flash:  pio run -t upload   (then: pio device monitor)

[env:cardputer-adv]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
monitor_speed = 115200

build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    ; NimBLE: peripheral only, saves RAM for synth voices
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

; Our own code: treat unsuffixed float literals as float (no soft doubles)
build_src_flags =
    -fsingle-precision-constant
    -Wall
    -Wno-unused-variable
    -Wno-unused-local-typedefs

lib_deps =
    mutable
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unified@>=0.2.10
    h2zero/NimBLE-Arduino@~2.3.4
